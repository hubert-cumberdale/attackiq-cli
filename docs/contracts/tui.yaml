version: 1
domain: tui
title: "TUI Runtime, State, and Cache Flow"
summary: "Implementation-aligned contract for `attackiq tui` runtime option resolution, tab workflows, and in-session caching behavior."
template: docs/contracts/templates/deep_dive.md.j2
generated_doc: docs/TUI_FLOW.md
command_surface:
  command: attackiq tui
  options:
    - name: --page-size
      required: false
      default: 20
    - name: --order-by
      required: false
      default: last_updated
    - name: --search
      required: false
      default: null
    - name: --tag
      required: false
      default: null
    - name: --filter-debounce
      required: false
      default: 0.4
    - name: --timeout
      required: false
      default: null
    - name: --auth-scheme
      required: false
      default: auto
      allowed_values: [auto, account-token, jwt, none]
    - name: --insecure
      required: false
      default: false
invariants:
  - "`run_tui` resolves timeout and TLS mode from CLI flags first, then config defaults."
  - "Workflow tabs are read-only and use shared service abstractions, not direct endpoint logic in widgets."
  - "Cache entries are bounded (`ATTACKIQ_TUI_CACHE_MAX`) and optionally TTL-pruned (`ATTACKIQ_TUI_CACHE_TTL`)."
  - "Status diagnostics refresh on explicit status refresh actions and tab activation transitions."
artifacts:
  - "Runtime diagnostics shown in Status and Settings tabs (auth/base-url/spec/cache/runtime sources)."
  - "Export files under `<workspace>/exports/` from workflow tabs (`e`/`c` shortcuts)."
  - "In-memory cache statistics surfaced via command palette cache commands."
code_references:
  - path: src/attackiq_cli/tui.py
    symbol: run_tui
  - path: src/attackiq_cli/tui_provider.py
    symbol: TuiDataProvider
  - path: src/attackiq_cli/tui.py
    symbol: AttackIQTuiApp
  - path: src/attackiq_cli/tui.py
    symbol: StatusTab
  - path: src/attackiq_cli/tui.py
    symbol: ScenariosTab
  - path: src/attackiq_cli/tui.py
    symbol: ResultsTab
  - path: src/attackiq_cli/tui.py
    symbol: AssessmentsTab
  - path: src/attackiq_cli/tui.py
    symbol: WorkflowTestsTab
  - path: src/attackiq_cli/tui.py
    symbol: WorkflowAssetsTab
  - path: src/attackiq_cli/tui.py
    symbol: WorkflowSettingsTab
test_references:
  - path: tests/test_cli_tui.py
  - path: tests/test_tui_layout.py
  - path: tests/test_tui_provider_cache.py
  - path: tests/test_tui_results.py
  - path: tests/test_tui_results_provider.py
help_checks:
  - command: [attackiq, tui, --help]
    options:
      - --page-size
      - --order-by
      - --search
      - --tag
      - --filter-debounce
      - --timeout
      - --auth-scheme
      - --insecure
