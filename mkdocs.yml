site_name: AttackIQ CLI Docs
site_description: Public operator and architecture documentation for AttackIQ CLI workflows.
site_author: AttackIQ CLI Maintainer
docs_dir: docs
site_dir: site
use_directory_urls: true

validation:
  nav:
    omitted_files: ignore

theme:
  name: readthedocs
  highlightjs: true

markdown_extensions:
  - admonition
  - codehilite
  - fenced_code
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
