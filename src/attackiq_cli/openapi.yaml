tags:
- name: assessments
  description: |
    ***Assessments*** are referred to as ***projects*** in the API request
    and response parameter lists. Generally speaking, the terms are synonymous,
    but assessment is the term used to refer to a collection of tests
    and scenarios in the AttackIQ UI.
- name: assets
  description: API calls for the Assets.
- name: blueprints
  description: API calls for the Blueprints.
- name: integrations
  description: |
    Utility functions to help you determine which integrations are installed,
    and what source types are mapped for each connector.
- name: tagged_items
  description: |
    API calls for managing Tags assigned to domain objects.
- name: mssp_public
  description: |
    API calls for the Partner Public API.
- name: AEV
  description: API calls for the Adversarial Exposure Validation (AEV) feature.
