                obj (ScenarioMasterJob): ScenarioMasterJob being serialized.

            Returns:
                bool:
          readOnly: true
        scheduled_count:
          type: integer
          description: |-
            Get the number of ScenarioJobs which are in-progress for the given ScenarioMasterJob.

