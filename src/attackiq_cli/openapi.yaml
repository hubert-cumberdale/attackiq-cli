        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: phase
        schema:
          type: string
          format: uuid
        description: ID of the Phase to filter.
      - in: query
        name: phase_number
        schema:
          type: integer
        description: Number of the Phase to filter.
      - in: query
        name: result_summary
        schema:
          type: string
          format: uuid
        description: ID of the Result Summary to filter.
      - in: query
        name: scenario_job_id
        schema:
          type: integer
        description: ID of the Scenario Job to filter.
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: trace_type
        schema:
          type: integer
        description: Number of the Trace Type to filter.
        examples:
          ? ''
          : value: null
          FilterByMitigation:
            value: 6
