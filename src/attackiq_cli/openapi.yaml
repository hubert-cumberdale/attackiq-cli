    PackageDownloadResponse:
      type: object
      description: Response schema for the package download/build endpoint.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/PackageDownloadResponseStatusEnum'
          description: |-
            Build status: 'In Progress' (poll again), 'Done' (download ready), or 'Error'.

            * `In Progress` - In Progress
            * `Done` - Done
            * `Error` - Error
        url:
          type: string
          format: uri
          description: Download URL for the customized package. Only present when
            status is 'Done'.
        customized_package_id:
          type: string
          format: uuid
          description: UUID of the build job. Pass as query parameter to poll for
            completion. Only present when status is 'In Progress'.
        detail:
          type: string
          description: Human-readable message providing additional context.
      required:
      - status
    PackageDownloadResponseStatusEnum:
      enum:
      - In Progress
      - Done
      - Error
      type: string
      description: |-
        * `In Progress` - In Progress
        * `Done` - Done
        * `Error` - Error
