  /v1/unified_mitigations_with_relations/import_vendor_rules:
    post:
      operationId: v1_unified_mitigations_with_relations_import_vendor_rules_create
      description: Manually trigger vendor rule import for the authenticated user's
        company. This endpoint allows administrators to sync vendor product alert
        rules (from integrations like Sentinel, Chronicle, Splunk ES) to UnifiedMitigation
        records on-demand, without waiting for the scheduled daily task.
      summary: Import vendor rules to unified mitigations
      parameters:
      - in: query
        name: dry_run
        schema:
          type: boolean
          default: false
        description: 'If true, preview changes without saving. Default: false'
      tags:
      - detection engineering
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  dry_run:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      created:
                        type: integer
                      updated:
                        type: integer
                      skipped:
                        type: integer
                      errors:
                        type: integer
                  message:
                    type: string
                example:
                  success: true
                  dry_run: false
                  stats:
                    created: 5
                    updated: 12
                    skipped: 3
                    errors: 0
                  message: 'Import completed: 5 created, 12 updated, 3 skipped'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                example:
                  detail: You do not have permission to perform this action.
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: Import already in progress for your company. Please try again
                    later.
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                example:
                  success: false
                  error: 'Import failed: Database connection failed'
          description: ''
