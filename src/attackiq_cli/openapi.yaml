  /v1/public/assessment/{id}/set_schedule:
    post:
      operationId: v1_public_assessment_set_schedule_create
      description: |
        Set or clear the schedule for a given assessment with advanced scheduling capabilities.

        This endpoint allows you to:
        * Set a cron-based schedule for automated assessment runs
        * Clear an existing schedule by setting new_schedule to null
        * Set start and end dates for the schedule
        * Use complex cron expressions including nth day of week (e.g., "0;9;*;*;1#2" for second Monday at 9 AM)

        **Cron Format:** minute;hour;day_of_month;month;day_of_week

        **Standard Examples:**
        * "0;9;*;*;1" - Every Monday at 9 AM
        * "30;14;1;*;*" - 1st day of every month at 2:30 PM
        * "0;*/6;*;*;*" - Every 6 hours

        **Advanced Examples (with complex day-of-week):**
        * "0;9;*;*;1#2" - Second Monday of every month at 9 AM
        * "0;14;*;*;5#5" - Last Friday of every month at 2 PM
        * "30;10;*;*;3#1" - First Wednesday of every month at 10:30 AM

        **Date Filtering:**
        * start_date: Schedule will not trigger before this date
        * end_date: Schedule will not trigger after this date
        * Both dates are optional and use YYYY-MM-DD format
      summary: Set Assessment Schedule
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: ID of the assessment to set schedule for.
        required: true
      tags:
      - public
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                new_schedule:
                  type: string
                  nullable: true
                  description: 'Cron string representing the new schedule. Set to
                    null to clear the current schedule. Format: ''minute;hour;day_of_month;month;day_of_week'''
                  example: 0;9;*;*;1
                start_date:
                  type: string
                  format: date
                  nullable: true
                  description: 'Start date for the schedule. Format: YYYY-MM-DD'
                  example: '2024-01-01'
                end_date:
                  type: string
                  format: date
                  nullable: true
                  description: 'End date for the schedule. Format: YYYY-MM-DD'
                  example: '2024-12-31'
              required: []
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
              examples:
                ScheduleSet:
                  value: Schedule for project 92f3bbf1-5c7b-49fa-a390-163ce880abb0
                    has been set to 0;9;*;*;1, start_date to 2024-01-01, end_date
                    to 2024-12-31
                  summary: Schedule Set
                ScheduleCleared:
                  value: Schedule for project 92f3bbf1-5c7b-49fa-a390-163ce880abb0
                    has been set to None, start_date to None, end_date to None
                  summary: Schedule Cleared
                ComplexSchedule:
                  value: Schedule for project 92f3bbf1-5c7b-49fa-a390-163ce880abb0
                    has been set to 0;9;*;*;1#2, start_date to None, end_date to None
                  summary: Complex Schedule
          description: Schedule successfully set or cleared
        '400':
          content:
            application/json:
              schema:
                type: string
              examples:
                ValidationError:
                  value: Start date must be before end date.
                  summary: Validation Error
                InvalidCronExpression:
                  value: 'Invalid cron expression: 0;9;*;*'
                  summary: Invalid Cron Expression
          description: Invalid request parameters
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: Assessment not found
