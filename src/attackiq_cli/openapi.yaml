  /v1/reporting/unified_mitigation_detection_performance_timeline:
    get:
      operationId: v1_reporting_unified_mitigation_detection_performance_timeline_retrieve
      description: |-
        API view for retrieving unified mitigation detection performance timeline data.

        This view provides SQL-based reporting for unified mitigation detection performance over time,
        showing detected, not detected, not tested, and total rule counts by time period.

        Query Parameters:
        - start_date: Start date for filtering results (YYYY-MM-DD)
        - end_date: End date for filtering results (YYYY-MM-DD)
        - time_interval: Time interval for aggregation ('weekly' or 'monthly', default: 'monthly')
        - mitigation_type_id: Filter by mitigation type ID (optional)
        - stage: Filter by rule stage (optional)
        - source_type: Filter by rule source type (optional)
        - integration_id: Filter by integration/vendor product ID (optional)
        - vendor_id: Filter by vendor ID (optional)
        - parent_rule: Filter by parent rule ID (optional)
        - tag_id: Filter by specific tag ID (optional)
        - tag_ids: Filter by multiple tag IDs, comma-separated (optional)
        - project_id: Filter by project association (optional)
      tags:
      - detection engineering
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          description: No response body
  /v1/reporting/unified_mitigation_precision_recall_timeline:
    get:
      operationId: v1_reporting_unified_mitigation_precision_recall_timeline_retrieve
      description: |-
        API view for retrieving unified mitigation precision and recall timeline data.

        This view provides SQL-based reporting for unified mitigation precision and recall
        metrics over time, calculated from True Positives (TP), False Positives (FP),
        and False Negatives (FN) derived from the `detection_outcome` field.

        Precision = TP / (TP + FP)
        Recall = TP / (TP + FN)

        Query Parameters (similar to performance timeline):
        - start_date: Start date for filtering results (YYYY-MM-DD)
        - end_date: End date for filtering results (YYYY-MM-DD)
        - time_interval: Time interval for aggregation ('weekly' or 'monthly', default: 'monthly')
        - mitigation_type_id: Filter by mitigation type ID (optional)
        - stage: Filter by rule stage (optional)
        - source_type: Filter by rule source type (optional)
        - integration_id: Filter by integration/vendor product ID (optional)
        - vendor_id: Filter by vendor ID (optional)
        - parent_rule: Filter by parent rule ID (optional)
        - tag_id: Filter by specific tag ID (optional)
        - tag_ids: Filter by multiple tag IDs, comma-separated (optional)
        - project_id: Filter by project association (optional)
      tags:
      - detection engineering
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          description: No response body
  /v1/results:
    get:
      operationId: v1_results_list
      description: "Get Assessment Prevention and Detection Results\n\n### Note:\n\
        The presence of the `assessment_results=true` parameter distinguishes the\
        \ supported\nresponse format from the legacy (deprecated) one. Until the deprecated\
        \ format\nis removed, you should always specify `assessment_results=true`.\n\
        \n### Performance Optimization:\n- **Default**: Returns only results from\
        \ the latest assessment run per project\n- **all_results=true**: Returns up\
        \ to 5,000 historical results (performance-safe)\n- **Large time-based queries**:\
        \ Automatically use cursor pagination and minimal serialization\n\nLarge time-based\
        \ queries (modified_after/created_after without project_id/run_id) will:\n\
        - Use cursor pagination for memory efficiency\n- Use minimal serializers for\
        \ consistent response format  \n- Skip expensive context building to prevent\
        \ memory issues\n- Always return the same data structure for the same query\n\
        \nFor best performance with large datasets, add specific filters (project_id,\
        \ run_id).\n"
      summary: Get Assessment Prevention and Detection Results
      parameters:
      - in: query
        name: all_results
        schema:
          type: boolean
          default: false
        description: Set to `true` to return up to 5,000 historical results (performance-safe).
      - in: query
        name: annotate_tag_set
        schema:
          type: string
      - in: query
        name: assessment_results
        schema:
          type: boolean
          default: true
        description: Per above, flag should be set to `true` at all times.
        required: true
      - in: query
        name: cursor
        schema:
          type: string
        description: Cursor for pagination (automatically used for large time-based
          queries)
      - in: query
        name: output
        schema:
          type: string
      - in: query
        name: project_tags
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: run_id
        schema:
          type: string
          format: uuid
      - in: query
        name: tag_id
        schema:
          type: string
          format: uuid
      tags:
      - results
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResultSummarySerializerAssessmentResultsList'
          description: ''
