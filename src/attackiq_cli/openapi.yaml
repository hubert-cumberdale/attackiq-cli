        description: DRF page size.
      - in: query
        name: status
        schema:
          type: string
        description: 'Optional displayed-status filter. Values: FINISHED, IN_PROGRESS,
          ERRORED, OFFLINE, PENDING_EXECUTION, NOT_STARTED, PENDING_DOWNLOAD, QUEUED,
          PICKED.'
