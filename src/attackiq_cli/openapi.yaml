openapi: 3.0.3
info:
  title: AttackIQ API
  version: 0.1.4 alpha (v1)
  description: AttackIQ OpenAPI 3.0 compliant schema
paths:
  /v1/assessment_templates:
    get:
      operationId: v1_assessment_templates_list
      description: |
        Retrieve Assessment Templates
         * Get All Assessment Templates
         * Get Assessment Template By Name (retrieve assessment template
           for a given Name)
         * Search for Assessment Templates (retrieve assessment templates
           whose names contain one or more search terms)
      summary: Retrieve Assessment Templates
      parameters:
      - in: query
        name: assessment_type
        schema:
          type: string
      - in: query
        name: assessment_type_exclude
        schema:
          type: string
      - in: query
        name: behavior
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: company
        schema:
          type: string
          format: uuid
      - in: query
        name: company_id
        schema:
          type: string
          format: uuid
      - in: query
        name: control_family
        schema:
          type: string
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: default_schedule
        schema:
          type: string
      - in: query
        name: icon
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: string
          format: uuid
      - in: query
        name: is_av2_compatible
        schema:
          type: boolean
      - in: query
        name: last_updated
        schema:
          type: string
          format: date-time
      - in: query
        name: modified
        schema:
          type: string
          format: date-time
      - in: query
        name: object_fingerprint
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project_description
        schema:
          type: string
      - in: query
        name: project_id
        schema:
          type: string
          format: uuid
      - in: query
        name: project_name
        schema:
          type: string
      - in: query
        name: project_template_type
        schema:
          type: string
          format: uuid
      - in: query
        name: project_template_type_id
        schema:
          type: string
          format: uuid
      - in: query
        name: search
        schema:
          type: string
        description: Parts of assessment template names in URL encoded format.
      - in: query
        name: sub_category
        schema:
          type: string
      - in: query
        name: syncd_on
        schema:
          type: string
          format: date-time
      - in: query
        name: template_description
        schema:
          type: string
      - in: query
        name: template_description_wrap_up
        schema:
          type: string
      - in: query
        name: template_name
        schema:
          type: string
        description: Name of the assessment template to retrieve in URL encoded format.
      - in: query
        name: user_type
        schema:
          type: string
          format: uuid
      - in: query
        name: user_type_id
        schema:
          type: string
          format: uuid
      - in: query
        name: vendor_product
        schema:
          type: string
          format: uuid
      - in: query
        name: vendor_product_id
        schema:
          type: string
          format: uuid
          nullable: true
        description: Specific Vendor Product Assessments
      tags:
      - assessments templates
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectTemplateSerializerReadCustomList'
          description: ''
  /v1/assessment_templates/{id}:
    get:
      operationId: v1_assessment_templates_retrieve
      description: Retrieve assessment template for a given ID
      summary: Retrieve Assessment Template By ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: ID of the assessment template to retrieve.
        required: true
      tags:
      - assessments templates
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTemplateSerializerReadCustom'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: ''
  /v1/assessments:
    get:
      operationId: v1_assessments_list
      description: |
        Retrieve Assessments
         * Get all Assessments
         * Get Assessment by Name (retrieve an assessment with the specified
           full name)
         * Search for Assessments (retrieve assessments whose *names* or
           *descriptions* contain one or more search terms)
      summary: Retrieve Assessments
      parameters:
      - in: query
        name: asset_group_id
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: blueprint_id
        schema:
          type: string
          format: uuid
      - in: query
        name: execution_strategy
        schema:
          type: integer
          enum:
          - 0
          - 1
        description: |-
          * `0` - Prevention and Detection
          * `1` - Prevention
      - in: query
        name: has_default_schedule
        schema:
          type: boolean
      - in: query
        name: id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: name
        schema:
          type: string
        description: Name of the assessment to retrieve in URL encoded format.
        examples:
          ? ''
          : value: null
          Example1:
            value: Windows Credential Theft
            summary: Example 1
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: report_instance_type
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
        description: Parts of assessment names or descriptions in URL encoded format.
        examples:
          ? ''
          : value: null
          Example1:
            value: Windows Credential
            summary: Example 1
      - in: query
        name: tag_id
        schema:
          type: string
      - in: query
        name: tag_ids
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: use_scenario_alert_rules
        schema:
          type: boolean
      - in: query
        name: version
        schema:
          type: integer
      - in: query
        name: zones_ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -attacker_zone
            - -target_zone
            - attacker_zone
            - target_zone
        description: |-
          Ordering

          * `attacker_zone` - Attacker zone
          * `-attacker_zone` - Attacker zone (descending)
          * `target_zone` - Target zone
          * `-target_zone` - Target zone (descending)
        explode: false
        style: form
      tags:
      - assessments
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectSerializerReadList'
          description: ''
  /v1/assessments/{id}:
    get:
      operationId: v1_assessments_retrieve
      description: Retrieve an assessment for a given assessment ID
      summary: Retrieve Assessment by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: ID of the assessment to retrieve.
        required: true
      tags:
      - assessments
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSerializerRead'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: ''
  /v1/assessments/{id}/run_all:
    post:
      operationId: v1_assessments_run_all_create
      description: Run all ScenarioMasterJobs or AttackGraphs in the given Project.
      summary: Run an Assessment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: ID of the assessment to be run.
        required: true
      tags:
      - assessments
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                OK:
                  value:
                    message: 'Successfully queued assessment run: Test Assessment'
                    started_at: '2019-08-23T22:48:35.771844'
                    run_id: 009ee184-964c-4555-bce3-4625dc090416
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: ''
  /v1/assessments/{id}/update_defaults:
    post:
      operationId: v1_assessments_update_defaults_create
      description: |
        Add Assets or Asset Groups to an Assessment
         * Add one or more individual assets with an assessment (adds a list of assets
           regardless of asset groups to an assessment).
         * Add assets belonging to 1 or more groups to an assessment (adds all assets
           contained in the specified groups to the assessment).
      summary: Add Assets or Asset Groups to an Assessment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: ID of the assessment to which assets or asset groups will be
          added.
        required: true
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateDefaultsApidoc'
            examples:
              Example1:
                value:
                  assets: b77596ec-e4bf-418f-ae33-520555a6105a,5d987e7d-91da-43d2-9e99-f346472e5cfc
                summary: Add Assets to an Assessment
                description: |
                  Add one or more individual assets with an assessment. This API
                   adds a list of assets regardless of asset groups to an assessment.
                  * **assets**: Comma separated series of asset IDs *(required)*
              Example2:
                value:
                  asset_groups: ae91d780-e438-4208-af68-c9c72ae66f93
                summary: Add Asset Group to an Assessment
                description: |
                  Add assets belonging to 1 or more groups to an assessment. This
                   API adds all assets contained in the specified groups to the assessment.
                  * **asset_groups**: Comma separated series of asset IDs *(required)*
        required: true
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Response:
                  value:
                    message: Successfully updated default assets/asset groups for
                      project 92f3bbf1-5c7b-49fa-a390-163ce880abb0
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: ''
  /v1/assessments/project_from_template:
    post:
      operationId: v1_assessments_project_from_template_create
      description: |
        Create a new Project from a given ProjectTemplate

        Parameters:
         * **template**: Assessment template ID.
         * **project_name**: User defined assessment name.
         * **blueprint**: Blueprint ID.
      summary: Create an Assessment
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectProjectFromTemplateApidoc'
            examples:
              Example1:
                value:
                  template: d09d29ba-eed8-4212-bff2-4d1ee11ed80c
                  project_name: Test Assessment
                  blueprint: ee15c9ab-2dbc-4d3f-9b86-35c00d0d1796
                summary: Create an Assessment
        required: true
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Created:
                  value:
                    project_id: 92f3bbf1-5c7b-49fa-a390-163ce880abb0
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                BadRequest:
                  value:
                    detail: 'Invalid template ID: a09d29ba-eed8-4212-bff2-4d1ee11ed80c'
                  summary: Bad Request
          description: ''
  /v1/assessments/schedule_list:
    get:
      operationId: get_project_schedule_list
      description: Retrieve a list of all periodic tasks for scheduled project runs
        across all versions (v1, v2, v3).
      summary: Get project schedule list
      tags:
      - assessments
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectScheduleListResponse'
          description: ''
  /v1/asset_groups:
    get:
      operationId: v1_asset_groups_list
      description: |
        Retrieve Asset Groups
         * Get all Asset Groups
         * Search for Asset Groups (retrieve Asset Groups whose names contain one or more search terms)
      summary: Retrieve Asset Groups
      parameters:
      - in: query
        name: company
        schema:
          type: string
          format: uuid
      - in: query
        name: company_id
        schema:
          type: string
          format: uuid
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: string
          format: uuid
      - in: query
        name: modified
        schema:
          type: string
          format: date-time
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Parts of Asset Groups names in URL encoded format.
        examples:
          ? ''
          : value: null
          Example1:
            value: Linux
            summary: Example 1
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      - in: query
        name: user_id
        schema:
          type: string
          format: uuid
      tags:
      - assets
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetGroupSerializerReadList'
          description: ''
  /v1/asset_groups/{id}:
    get:
      operationId: v1_asset_groups_retrieve
      description: Retrieve an Asset Group for a given Asset Group ID
      summary: Retrieve Asset Group by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: ID of the Asset Group to retrieve.
        required: true
      tags:
      - assets
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGroupSerializerRead'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: ''
  /v1/assets:
    get:
      operationId: v1_assets_list
      description: |
        Retrieve Assets
         * Get All Assets
         * Get Assets by Asset Group ID (retrieve all Assets belonging to the specified Asset Group)
         * Get Assets by Deployment State (retrieve all Assets for a given Deployment State):
           * 2: Installed
           * 3: Updating
           * 5: Uninstalled
           * 6: UninstallFailed
         * Get Assets by Host Name (retrieve an Asset for a given hostname)
         * Get Assets by IPv4 Address (retrieve an Asset for a given IPv4 address)
         * Get Assets by IPv6 Address (retrieve an Asset for a given IPv6 address)
      summary: Retrieve Assets
      parameters:
      - in: query
        name: activity_type
        schema:
          type: string
          enum:
          - DEVICE
          - DOMAIN
          - TESTPOINT
        description: |-
          * `DEVICE` - DEVICE
          * `TESTPOINT` - TESTPOINT
          * `DOMAIN` - DOMAIN
      - in: query
        name: asset_group
        schema:
          type: string
          format: uuid
        description: ID of the Asset Group containing the Assets to retrieve.
      - in: query
        name: assetlicense
        schema:
          type: string
          format: uuid
      - in: query
        name: business_impact
        schema:
          type: integer
      - in: query
        name: deepsurface_id
        schema:
          type: string
      - in: query
        name: deepsurface_last_seen_in_host_analysis_at
        schema:
          type: string
          format: date-time
      - in: query
        name: deepsurface_scanned
        schema:
          type: boolean
      - in: query
        name: deepsurface_sync_state
        schema:
          type: string
          nullable: true
          enum:
          - IN_SYNC
          - NO_LONGER_SEEN
        description: |-
          * `IN_SYNC` - In sync
          * `NO_LONGER_SEEN` - No longer seen
      - in: query
        name: deepsurface_sync_state_changed_at
        schema:
          type: string
          format: date-time
      - in: query
        name: deployment_state
        schema:
          type: integer
      - in: query
        name: deployment_state_id
        schema:
          type: integer
        description: Deployment State number.
        examples:
          ? ''
          : value: null
          FilterByInstalled:
            value: 2
            summary: Filter by Installed
          FilterByUninstalled:
            value: 5
            summary: Filter by Uninstalled
      - in: query
        name: hide_hosted_agents
        schema:
          type: string
      - in: query
        name: hostname
        schema:
          type: string
          format: hostname
        description: Hostname of the Asset.
        examples:
          ? ''
          : value: null
          Example1:
            value: agent_host
            summary: Example 1
      - in: query
        name: ipv4_address
        schema:
          type: string
          format: ipv4
        description: IPv4 address string of the Asset.
        examples:
          ? ''
          : value: null
          Example1:
            value: 192.168.1.75
            summary: Example 1
      - in: query
        name: ipv6_address
        schema:
          type: string
          format: ipv6
        description: IPv6 address string of the Asset.
        examples:
          ? ''
          : value: null
          Example1:
            value: 2607:f0d0:1002:51::4
            summary: Example 1
      - in: query
        name: last_seen_discovery
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: risk
        schema:
          type: string
      - in: query
        name: risk_score
        schema:
          type: number
          format: float
      - in: query
        name: running_scheduled_job_id
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: show_pool_agents
        schema:
          type: string
      - in: query
        name: testpoint_id
        schema:
          type: string
          format: uuid
      tags:
      - assets
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetSerializerReadList'
          description: ''
  /v1/assets/{id}:
    get:
      operationId: v1_assets_retrieve
      description: Retrieve an Asset for a given Asset ID
      summary: Retrieve Asset by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: ID of the Asset to retrieve.
        required: true
      tags:
      - assets
      security:
      - Account Token: []
      - JSON Web Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSerializerReadResponseDoc'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: ''
  /v1/assets/csv:
    get:
      operationId: v1_assets_csv_retrieve
      description: Retrieve Assets as a CSV file
      summary: Retrieve Assets as a CSV file
      parameters:
      - in: query
        name: activity_type
        schema:
          type: string
          enum:
          - DEVICE
          - DOMAIN
          - TESTPOINT
        description: |-
          * `DEVICE` - DEVICE
          * `TESTPOINT` - TESTPOINT
          * `DOMAIN` - DOMAIN
      - in: query
        name: asset_group
        schema:
          type: string
          format: uuid
        description: ID of the Asset Group containing the Assets to retrieve.
      - in: query
        name: assetlicense
        schema:
          type: string
          format: uuid
      - in: query
        name: business_impact
        schema:
          type: integer
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: '**Examples:** 2020-10-09, 2015-10-09%2023:04:43.885789'
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: '**Examples:** 2020-10-09, 2015-10-09%2023:04:43.885789'
      - in: query
        name: deepsurface_id
        schema:
          type: string
      - in: query
        name: deepsurface_last_seen_in_host_analysis_at
        schema:
          type: string
          format: date-time
      - in: query
        name: deepsurface_scanned
        schema:
          type: boolean
      - in: query
        name: deepsurface_sync_state
        schema:
          type: string
          nullable: true
          enum:
          - IN_SYNC
          - NO_LONGER_SEEN
        description: |-
          * `IN_SYNC` - In sync
          * `NO_LONGER_SEEN` - No longer seen
      - in: query
        name: deepsurface_sync_state_changed_at
        schema:
          type: string
          format: date-time
      - in: query
        name: deployment_state
        schema:
          type: integer
      - in: query
        name: deployment_state_id
        schema:
          type: integer
        description: Deployment State number.
        examples:
          ? ''
          : value: null
          FilterByInstalled:
            value: 2
            summary: Filter by Installed
          FilterByUninstalled:
            value: 5
            summary: Filter by Uninstalled
      - in: query
        name: fields
        schema:
          type: string
        description: |2

          Specify a custom field display.
          This may be any one or more of the default fields.
        examples:
          ? ''
